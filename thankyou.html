// ── Order details, passed here from the order form's redirect URL ──
// Your order form needs to redirect to:
//   thank-you.html?order_id=ORD-1029&value=1600
// (see instructions below the code)
var _params = new URLSearchParams(window.location.search);
var _orderId = _params.get('order_id');
var _orderValue = _params.get('value');

// CHANGE THIS to your real deployed Cloudflare Worker URL
var WORKER_URL = 'https://fancy-hill-74c6.kazayadav.workers.dev/';

if (_orderId && _orderValue) {
  // Browser-side Purchase event — value/currency now included, eventID for dedup
  fbq('track', 'Purchase', {
    value: Number(_orderValue),
    currency: 'NPR'
  }, {
    eventID: _orderId
  });

  // Server-side Purchase event via your Conversions API Worker
  fetch(WORKER_URL, {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      order_id: _orderId,
      value: Number(_orderValue),
      currency: 'NPR',
      event_source_url: window.location.origin + window.location.pathname
    })
  }).catch(function (err) {
    console.error('Conversions API call failed:', err);
  });
} else {
  // Fallback only — this fires if the order form hasn't been updated yet
  // to pass order_id/value. Fix the redirect below so this branch stops running.
  fbq('track', 'Purchase');

    <style>
